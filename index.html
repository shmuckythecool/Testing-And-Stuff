<!DOCTYPE html>
<html>
<body>
  <button id="button1">0</button>
  <button id="button2">upgrade: 10</button>
  <button id="button3">upgrade: 100</button>
  <script>
    let moneyperclick = 1;
    let clickspersecond = 0;
    let currentclicks = 0;
    let button2price = 10;
    let button3price = 100;
    let totalclicks = 0;
    document.getElementById("button1").onclick = function() {
      currentclicks += moneyperclick;
      totalclicks += moneyperclick;
      update_buttons();
    };
    document.getElementById("button2").onclick = function() {
      if (currentclicks >= button2price) {
        moneyperclick += 1;
        currentclicks -= button2price;
        button2price = Math.round(button2price * 1.3);
      }
      update_buttons();
    };
    document.getElementById("button3").onclick = function() {
      if (currentclicks >= button3price) {
        clickspersecond += 1
        currentclicks -= button3price;
        button3price = Math.round(button3price * 1.3);
      }
      update_buttons();
    };
    let autoclick = function() {
      setInterval(function() {
        if (clickspersecond > 0) {
          currentclicks += clickspersecond;
          totalclicks += clickspersecond;
          update_buttons();
        }
      }, 1000);
    }
    let update_buttons = function() {
      let button3 = document.getElementById("button3");
      let button2 = document.getElementById("button2");
      let button1 = document.getElementById("button1");
      button1.style.backgroundColor = "white"
      document.getElementById("button1").innerText = currentclicks;
      document.getElementById("button2").innerText = "upgrade: " + button2price;
      document.getElementById("button3").innerText = "upgrade: " + button3price;
      if (totalclicks < 100) {
        button3.style.display = "none";
      } else {
        button3.style.display = "inline-block";
      }
      if (currentclicks < button3price) {
        button3.style.backgroundColor = "black";
        button3.style.color = "white";
      } else {
        button3.style.backgroundColor = "white";
        button3.style.color = "black";
      }
      if (currentclicks < button2price) {
        button2.style.backgroundColor = "black";
        button2.style.color = "white";
      } else {
        button2.style.backgroundColor = "white";
        button2.style.color = "black";
      }
    };
    autoclick();
    update_buttons();
  </script>
</body>
</html>
